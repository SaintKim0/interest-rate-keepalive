name: keep awake

on:
  schedule:
    # 매 5분. 정시는 GitHub 예약이 몰려 늦어지므로 3분부터 시작한다.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 금리 서버 헬스 확인
        run: curl --fail --silent --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 120 https://interest-rate.onrender.com/api/health
